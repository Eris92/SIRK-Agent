name: SIRK Agent Runtime Endurance CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/endurance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endurance-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish runtime
        shell: pwsh
        run: |
          dotnet publish src/SirkAgent.Service/SirkAgent.Service.csproj -c Release -r win-x64 --self-contained false -p:InformationalVersion=1.0.0+${{ github.sha }} -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Report/SirkAgent.Report.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Cli/SirkAgent.Cli.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Session/SirkAgent.Session.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.BrowserHost/SirkAgent.BrowserHost.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          Copy-Item tools/package/*.ps1 artifacts/SIRK-Agent-Runtime/ -Force
          $runtime = Resolve-Path artifacts/SIRK-Agent-Runtime
          Copy-Item browser-extension artifacts/SIRK-Agent-Runtime/BrowserExtension -Recurse -Force
          $protected = @('SirkAgent.Service.exe','SirkAgent.Service.dll','SirkAgent.Policy.dll','SirkAgent.Report.exe','sirkctl.exe','SirkAgent.Session.exe','SirkAgent.Session.dll','SirkAgent.BrowserHost.exe','SirkAgent.BrowserHost.dll')
          $files = foreach ($name in $protected) {
            $path = Join-Path $runtime $name
            @{ path = $name; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash }
          }
          @{ files = $files } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $runtime 'integrity-manifest.json') -Encoding UTF8
          @{ product='SIRK Agent'; version='1.0.0'; commit='${{ github.sha }}'; runtime='win-x64'; requiredRuntime='.NET 8 x64'; selfContained=$false } | ConvertTo-Json | Set-Content (Join-Path $runtime 'build-manifest.json') -Encoding UTF8

      - name: Prepare oversized event log and install
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $root -ItemType Directory -Force | Out-Null
          $eventLog = Join-Path $root 'agent-events.jsonl'
          $stream = [IO.File]::Create($eventLog)
          try { $stream.SetLength(11MB) } finally { $stream.Dispose() }
          ./artifacts/SIRK-Agent-Runtime/Install-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent Endurance CI"
          (Get-Service SirkAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))

      - name: Validate runtime health and log rotation
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          $runtimePath = Join-Path $root 'runtime-health.json'
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $runtimePath) {
              try {
                $runtime = Get-Content $runtimePath -Raw | ConvertFrom-Json
                if ($runtime.heartbeatFresh -eq $true -and $runtime.code -eq 'RUNTIME_HEALTHY') { $ready = $true; break }
              } catch {}
            }
          }
          if (-not $ready) { throw 'Runtime health did not become healthy.' }
          if ($runtime.workingSetBytes -le 0 -or $runtime.privateMemoryBytes -le 0 -or $runtime.threadCount -le 0) { throw 'Runtime metrics are invalid.' }
          if ($runtime.cpuPercent -lt 0 -or $runtime.cpuPercent -gt 100) { throw "CPU metric out of range: $($runtime.cpuPercent)" }
          if (-not (Test-Path (Join-Path $root 'agent-events.jsonl.1'))) { throw 'Oversized event log was not rotated.' }
          $runtime | ConvertTo-Json -Depth 8 | Set-Content artifacts/runtime-health-initial.json

      - name: Validate repeated restarts
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          $runtimePath = Join-Path $root 'runtime-health.json'
          $heartbeatPath = Join-Path $root 'heartbeat-latest.json'
          $firstDevice = (Get-Content $heartbeatPath -Raw | ConvertFrom-Json).deviceId
          $processIds = @()
          for ($cycle = 1; $cycle -le 5; $cycle++) {
            $before = (Get-Content $runtimePath -Raw | ConvertFrom-Json).processId
            Restart-Service SirkAgent
            (Get-Service SirkAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))
            $changed = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              try {
                $runtime = Get-Content $runtimePath -Raw | ConvertFrom-Json
                $heartbeat = Get-Content $heartbeatPath -Raw | ConvertFrom-Json
                if ($runtime.processId -ne $before -and $runtime.heartbeatFresh -eq $true -and $heartbeat.deviceId -eq $firstDevice) {
                  $changed = $true
                  $processIds += $runtime.processId
                  break
                }
              } catch {}
            }
            if (-not $changed) { throw "Restart cycle $cycle did not produce a healthy new process with the same Device ID." }
          }
          if (($processIds | Select-Object -Unique).Count -lt 5) { throw 'Process ID was not renewed for every restart.' }
          @{ deviceId=$firstDevice; processIds=$processIds } | ConvertTo-Json -Depth 5 | Set-Content artifacts/restart-results.json

      - name: Package
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/Uninstall-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent Endurance CI" -Confirm:$false
          Compress-Archive -Path artifacts/SIRK-Agent-Runtime/* -DestinationPath artifacts/SIRK-Agent-1.0.0-win-x64.zip -CompressionLevel Optimal -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-1.0.0-win-x64
          path: |
            artifacts/SIRK-Agent-1.0.0-win-x64.zip
            artifacts/SIRK-Agent-Runtime/**
            artifacts/runtime-health-initial.json
            artifacts/restart-results.json
          if-no-files-found: error
