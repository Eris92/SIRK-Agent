name: Locate Endurance Contract

on:
  push:
    branches: [ fix/enrollment-readiness-diagnostics ]
    paths: [ '.github/workflows/locate-endurance-contract.yml' ]

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrollment-readiness-diagnostics
      - name: Capture matching workflow
        run: |
          file=$(grep -R -l "Oversized event log was not rotated" .github/workflows | grep -v locate-endurance-contract.yml | head -n 1)
          test -n "$file"
          mkdir -p diagnostics
          printf '%s\n' "$file" > diagnostics/endurance-workflow-path.txt
          cp "$file" diagnostics/endurance-workflow.yml
          rm -f .github/workflows/locate-endurance-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture stale endurance workflow definition'
          git push origin HEAD:fix/enrollment-readiness-diagnostics
