name: SIRK Agent Complete Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'global.json'
      - 'src/**'
      - 'installer/**'
      - 'tools/package/**'
      - 'browser-extension/**'
      - '.github/workflows/release-installers.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.16-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate .NET 10-only contract
        shell: pwsh
        run: |
          dotnet --info
          $projects = Get-ChildItem src,tests,tools -Recurse -File -Filter '*.csproj' -ErrorAction SilentlyContinue
          if (-not $projects.Count) { throw 'No Agent projects were found.' }
          foreach ($project in $projects) {
            $text = Get-Content $project.FullName -Raw
            if ($text -notmatch '<TargetFramework>net10\.0(?:-windows(?:10\.0\.17763)?)?</TargetFramework>') {
              throw "Project is not .NET 10-only: $($project.FullName)"
            }
            if ($text -match 'net(?:8|9)\.0') { throw "Legacy target framework: $($project.FullName)" }
          }

      - name: Build framework-dependent Agent runtime
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'artifacts/runtime'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $projects = @(
            'src/SirkAgent.Service/SirkAgent.Service.csproj',
            'src/SirkAgent.Report/SirkAgent.Report.csproj',
            'src/SirkAgent.Cli/SirkAgent.Cli.csproj',
            'src/SirkAgent.Session/SirkAgent.Session.csproj',
            'src/SirkAgent.BrowserHost/SirkAgent.BrowserHost.csproj',
            'src/SirkAgent.Watchdog/SirkAgent.Watchdog.csproj'
          )
          foreach ($project in $projects) {
            $output = if ($project -like '*SirkAgent.Session*') { Join-Path $payload 'Session' } else { $payload }
            dotnet publish $project `
              -c Release -r win-x64 --self-contained false `
              -p:PublishSingleFile=false -p:PublishTrimmed=false `
              "-p:InformationalVersion=$env:VERSION+${{ github.sha }}" `
              -o $output
            if ($LASTEXITCODE -ne 0) { throw "Runtime publish failed: $project" }
          }

          Copy-Item 'tools/package/*.ps1' $payload -Force
          Copy-Item 'browser-extension' (Join-Path $payload 'BrowserExtension') -Recurse -Force

          $files = Get-ChildItem $payload -Recurse -File |
            Where-Object Extension -in '.exe','.dll' |
            Sort-Object FullName |
            ForEach-Object {
              @{
                path = [IO.Path]::GetRelativePath($payload, $_.FullName)
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          @{
            schemaVersion = 2
            files = $files
          } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $payload 'integrity-manifest.json') -Encoding UTF8

          @{
            schemaVersion = 2
            product = 'SIRK Agent'
            version = $env:VERSION
            commit = '${{ github.sha }}'
            buildUtc = (Get-Date).ToUniversalTime().ToString('o')
            architecture = 'win-x64'
            deploymentMode = 'framework-dependent'
            targetFramework = 'net10.0-windows'
            requiredRuntime = 'Microsoft.NETCore.App 10.0'
            compatibilityMode = $false
            authenticodeSigned = $false
            testRelease = $true
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $payload 'runtime-manifest.json') -Encoding UTF8

          foreach ($required in @(
            'SirkAgent.Service.exe',
            'SirkAgent.Watchdog.exe',
            'sirkctl.exe',
            'Install-SirkAgent.ps1',
            'Install-SirkAgent-WithUpdater.ps1',
            'Register-SirkUpdater.ps1',
            'runtime-manifest.json',
            'integrity-manifest.json'
          )) {
            if (-not (Test-Path (Join-Path $payload $required))) { throw "Runtime package is missing: $required" }
          }
          foreach ($forbidden in @('coreclr.dll','hostfxr.dll','hostpolicy.dll','clrjit.dll','System.Private.CoreLib.dll')) {
            if (Test-Path (Join-Path $payload $forbidden)) { throw "Bundled .NET runtime is forbidden: $forbidden" }
          }

          $zipName = "SIRK-Agent-$env:VERSION-net10-win-x64-framework-dependent.zip"
          $zipPath = Join-Path $PWD "artifacts/$zipName"
          Compress-Archive -Path "$payload/*" -DestinationPath $zipPath -CompressionLevel Optimal
          $sizeMb = [Math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          if ($sizeMb -gt 50) { throw "Agent runtime ZIP exceeds 50 MB: $sizeMb MB" }
          Write-Host "Agent runtime ZIP: $sizeMb MB"
          "RUNTIME_ZIP=$zipName" | Out-File $env:GITHUB_ENV -Append

      - name: Build Native AOT setup EXE
        shell: pwsh
        run: |
          dotnet publish src/SirkAgent.Setup/SirkAgent.Setup.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishAot=true -p:StripSymbols=true `
            -o artifacts/setup
          $exe = 'artifacts/setup/SIRK-Agent-Setup.exe'
          if (-not (Test-Path $exe)) { throw 'Native AOT setup EXE is missing.' }
          $sizeMb = [Math]::Round((Get-Item $exe).Length / 1MB, 2)
          if ($sizeMb -gt 25) { throw "Setup EXE exceeds 25 MB: $sizeMb MB" }
          Copy-Item $exe 'artifacts/SIRK-Agent-Setup.exe' -Force
          Write-Host "Setup EXE: $sizeMb MB"

      - name: Build MSI with WiX 6
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix build installer/Product.wxs `
            -arch x64 `
            -d SetupExe="$PWD/artifacts/SIRK-Agent-Setup.exe" `
            -o artifacts/SIRK-Agent-$env:VERSION-win-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed. ExitCode=$LASTEXITCODE" }
          if (-not (Test-Path "artifacts/SIRK-Agent-$env:VERSION-win-x64.msi")) { throw 'MSI is missing.' }

      - name: Create checksums and manifests
        shell: pwsh
        run: |
          $files = @(
            'artifacts/SIRK-Agent-Setup.exe',
            "artifacts/SIRK-Agent-$env:VERSION-win-x64.msi",
            "artifacts/$env:RUNTIME_ZIP"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))" | Set-Content "$file.sha256" -Encoding ASCII
          }
          @{
            schemaVersion = 2
            version = $env:VERSION
            targetFramework = 'net10.0-windows'
            requiredRuntime = 'Microsoft.NETCore.App 10.0'
            compatibilityMode = $false
            setupExe = 'SIRK-Agent-Setup.exe'
            msi = "SIRK-Agent-$env:VERSION-win-x64.msi"
            runtimeZip = $env:RUNTIME_ZIP
            silentExe = 'SIRK-Agent-Setup.exe --portal-url https://portal.example --enrollment-token TOKEN --channel stable'
            silentMsi = "msiexec /i SIRK-Agent-$env:VERSION-win-x64.msi /qn /norestart PORTAL_URL=https://portal.example ENROLLMENT_TOKEN=TOKEN SIRK_CHANNEL=stable"
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts/installer-manifest.json -Encoding UTF8

      - name: Publish complete GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SIRK Agent ${{ env.VERSION }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/SIRK-Agent-Setup.exe
            artifacts/SIRK-Agent-Setup.exe.sha256
            artifacts/SIRK-Agent-${{ env.VERSION }}-win-x64.msi
            artifacts/SIRK-Agent-${{ env.VERSION }}-win-x64.msi.sha256
            artifacts/${{ env.RUNTIME_ZIP }}
            artifacts/${{ env.RUNTIME_ZIP }}.sha256
            artifacts/runtime/runtime-manifest.json
            artifacts/installer-manifest.json
