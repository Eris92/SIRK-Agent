name: Policy Engine CI

on:
  push:
    branches:
      - main
      - policy-engine-foundation
  pull_request:
    paths:
      - 'src/SirkAgent.Policy/**'
      - 'tests/SirkAgent.Policy.Tests/**'
      - '.github/workflows/policy-engine-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/SirkAgent.Policy.Tests/SirkAgent.Policy.Tests.csproj
      - name: Test
        run: dotnet test tests/SirkAgent.Policy.Tests/SirkAgent.Policy.Tests.csproj --configuration Release --no-restore
