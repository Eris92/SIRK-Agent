name: SIRK Agent Installers

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'global.json'
      - 'src/SirkAgent.Setup/**'
      - 'installer/**'
      - 'tools/package/**'
      - '.github/workflows/release-installers.yml'

permissions:
  contents: write

jobs:
  build-installers:
    runs-on: windows-latest
    env:
      VERSION: 1.0.16-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate .NET 10-only contract
        shell: pwsh
        run: |
          dotnet --info
          $projects = Get-ChildItem src,tests,tools -Recurse -File -Filter '*.csproj' -ErrorAction SilentlyContinue
          if (-not $projects.Count) { throw 'No Agent projects were found.' }
          foreach ($project in $projects) {
            $text = Get-Content $project.FullName -Raw
            if ($text -notmatch '<TargetFramework>net10\.0(?:-windows(?:10\.0\.17763)?)?</TargetFramework>') {
              throw "Project is not .NET 10-only: $($project.FullName)"
            }
            if ($text -match 'net(?:8|9)\.0') { throw "Legacy target framework: $($project.FullName)" }
          }

      - name: Build Native AOT setup EXE
        shell: pwsh
        run: |
          dotnet restore src/SirkAgent.Setup/SirkAgent.Setup.csproj -r win-x64
          dotnet publish src/SirkAgent.Setup/SirkAgent.Setup.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -p:PublishAot=true -p:StripSymbols=true `
            -o artifacts/setup
          $exe = 'artifacts/setup/SIRK-Agent-Setup.exe'
          if (-not (Test-Path $exe)) { throw 'Native AOT setup EXE is missing.' }
          $sizeMb = [Math]::Round((Get-Item $exe).Length / 1MB, 2)
          if ($sizeMb -gt 25) { throw "Setup EXE exceeds 25 MB: $sizeMb MB" }
          Write-Host "Setup EXE: $sizeMb MB"

      - name: Install WiX 6
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          wix build installer/Product.wxs `
            -arch x64 `
            -d SetupExe="$PWD/artifacts/setup/SIRK-Agent-Setup.exe" `
            -o artifacts/SIRK-Agent-$env:VERSION-win-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed. ExitCode=$LASTEXITCODE" }
          if (-not (Test-Path "artifacts/SIRK-Agent-$env:VERSION-win-x64.msi")) { throw 'MSI build failed.' }

      - name: Resolve current .NET 10 Agent runtime package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api 'repos/${{ github.repository }}/releases?per_page=30' | ConvertFrom-Json
          $selected = $null
          foreach ($release in @($releases)) {
            if ($release.draft) { continue }
            $manifestAsset = @($release.assets | Where-Object name -eq 'runtime-manifest.json' | Select-Object -First 1)
            $candidate = @($release.assets | Where-Object name -match 'win-x64-framework-dependent.*\.zip$' | Select-Object -First 1)
            if ($candidate.Count -ne 1) { continue }
            if ($manifestAsset.Count -eq 1) {
              $manifestPath = Join-Path $env:TEMP 'runtime-manifest.json'
              gh api $manifestAsset[0].url -H 'Accept: application/octet-stream' > $manifestPath
              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              if ($manifest.targetFramework -ne 'net10.0-windows' -or $manifest.requiredRuntime -ne 'Microsoft.NETCore.App 10.0') { continue }
            }
            $selected = $candidate[0]
            break
          }
          if (-not $selected) { throw 'No release contains the canonical .NET 10 Agent runtime ZIP.' }
          gh api $selected.url -H 'Accept: application/octet-stream' > "artifacts/$($selected.name)"
          "RUNTIME_ZIP=$($selected.name)" | Out-File $env:GITHUB_ENV -Append

      - name: Create checksums and contract report
        shell: pwsh
        run: |
          $files = @(
            'artifacts/SIRK-Agent-Setup.exe',
            "artifacts/SIRK-Agent-$env:VERSION-win-x64.msi",
            "artifacts/$env:RUNTIME_ZIP"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))" | Set-Content "$file.sha256" -Encoding ASCII
          }
          @{
            schemaVersion = 2
            version = $env:VERSION
            targetFramework = 'net10.0-windows'
            requiredRuntime = 'Microsoft.NETCore.App 10.0'
            compatibilityMode = $false
            setupExe = 'SIRK-Agent-Setup.exe'
            msi = "SIRK-Agent-$env:VERSION-win-x64.msi"
            runtimeZip = $env:RUNTIME_ZIP
            silentExe = 'SIRK-Agent-Setup.exe --portal-url https://portal.example --enrollment-token TOKEN --channel stable'
            silentMsi = "msiexec /i SIRK-Agent-$env:VERSION-win-x64.msi /qn /norestart PORTAL_URL=https://portal.example ENROLLMENT_TOKEN=TOKEN SIRK_CHANNEL=stable"
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts/installer-manifest.json -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SIRK Agent ${{ env.VERSION }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/SIRK-Agent-Setup.exe
            artifacts/SIRK-Agent-Setup.exe.sha256
            artifacts/SIRK-Agent-${{ env.VERSION }}-win-x64.msi
            artifacts/SIRK-Agent-${{ env.VERSION }}-win-x64.msi.sha256
            artifacts/${{ env.RUNTIME_ZIP }}
            artifacts/${{ env.RUNTIME_ZIP }}.sha256
            artifacts/installer-manifest.json
