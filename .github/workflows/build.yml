name: Build and publish plugin

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workspace-develop-publish
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content './MeshCentral-Plugin/config.json' -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Plugin version is missing in config.json.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Plugin version: $version"

      - name: Build native runtime and plugin
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/build.ps1 -Configuration Release -Runtime win-x64

      - name: Verify no Visual C++ runtime dependency
        run: |
          $ErrorActionPreference = 'Stop'
          $vsRoot = Join-Path $env:ProgramFiles 'Microsoft Visual Studio'
          $dumpbin = Get-ChildItem $vsRoot -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem $vsRoot -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsRoot" }
          foreach ($exe in @(
            './artifacts/WorkspaceHost-win-x64/WorkspaceHost.exe',
            './artifacts/WorkspaceHost-win-x64/WorkspaceCapture.exe'
          )) {
            if (-not (Test-Path $exe)) { throw "Runtime executable not found: $exe" }
            $dependencies = & $dumpbin /dependents (Resolve-Path $exe) 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $exe with exit code $LASTEXITCODE" }
            Write-Host "Dependencies for $exe"
            Write-Host $dependencies
            if ($dependencies -match '(?im)^\s*(VCRUNTIME\d*(?:_\d+)?|MSVCP\d+|CONCRT\d+)\.dll\s*$') {
              throw "$exe still depends on Visual C++ Redistributable DLLs."
            }
          }

      - name: Verify WorkspaceHost heartbeat
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/test-workspacehost.ps1 -ExePath ./artifacts/WorkspaceHost-win-x64/WorkspaceHost.exe

      - name: Verify WorkspaceCapture version
        run: |
          $ErrorActionPreference = 'Stop'
          $captureOutput = & ./artifacts/WorkspaceHost-win-x64/WorkspaceCapture.exe --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "WorkspaceCapture --version failed with exit code $LASTEXITCODE. Output: $captureOutput" }
          $captureVersion = [string]($captureOutput | Select-Object -First 1)
          $captureVersion = $captureVersion.Trim()
          if ($captureVersion -ne '0.1.0') { throw "Unexpected WorkspaceCapture version: $captureVersion" }

      - name: Prepare distribution files
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $pluginZip = "./artifacts/MeshCentral-Workspace-Plugin-$version.zip"
          if (-not (Test-Path $pluginZip)) { throw "Plugin archive not found: $pluginZip" }

          foreach ($name in @('WorkspaceHost.exe','WorkspaceCapture.exe')) {
            Copy-Item "./artifacts/WorkspaceHost-win-x64/$name" "./artifacts/$name" -Force
            $hash = (Get-FileHash "./artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "./artifacts/$name.sha256" "$hash  $name" -Encoding ascii
          }
          Compress-Archive -Path ./artifacts/WorkspaceHost-win-x64/* -DestinationPath ./artifacts/WorkspaceHost-win-x64.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeshCentral-Workspace-${{ steps.version.outputs.version }}
          path: |
            artifacts/MeshCentral-Workspace-Plugin-${{ steps.version.outputs.version }}.zip
            artifacts/WorkspaceHost-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish develop-latest runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'

          gh release view develop-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete develop-latest --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Cannot delete previous develop-latest release. Exit code: $LASTEXITCODE" }
          }

          gh release create develop-latest `
            ./artifacts/WorkspaceHost.exe `
            ./artifacts/WorkspaceHost.exe.sha256 `
            ./artifacts/WorkspaceCapture.exe `
            ./artifacts/WorkspaceCapture.exe.sha256 `
            ./artifacts/WorkspaceHost-win-x64.zip `
            ./artifacts/MeshCentral-Workspace-Plugin-$version.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Development build $version" `
            --notes "Automatic tested build from develop commit $env:GITHUB_SHA." `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Cannot create develop-latest release. Exit code: $LASTEXITCODE" }

      - name: Publish plugin-only branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $dist = Join-Path $env:RUNNER_TEMP 'workspace-plugin-dist'
          $publish = Join-Path $env:RUNNER_TEMP 'workspace-plugin-publish'
          Remove-Item $dist,$publish -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $dist -ItemType Directory -Force | Out-Null
          Copy-Item './MeshCentral-Plugin/*' $dist -Recurse -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add --detach $publish HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot create publication worktree. Exit code: $LASTEXITCODE" }

          Push-Location $publish
          try {
            git checkout --orphan plugin-publish
            if ($LASTEXITCODE -ne 0) { throw "Cannot create orphan publication branch. Exit code: $LASTEXITCODE" }
            git rm -rf .
            Copy-Item "$dist/*" . -Recurse -Force
            git add --all
            git commit -m "Publish MeshCentral Workspace plugin $version ($env:GITHUB_SHA)"
            if ($LASTEXITCODE -ne 0) { throw "Cannot commit plugin publication. Exit code: $LASTEXITCODE" }
            git push origin HEAD:plugin --force
            if ($LASTEXITCODE -ne 0) { throw "Cannot push plugin branch. Exit code: $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

      - name: Verify published plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ steps.version.outputs.version }}'
          $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/config.json?ref=plugin" --jq .content
          if ($LASTEXITCODE -ne 0) { throw "Cannot read config.json from plugin branch. Exit code: $LASTEXITCODE" }
          $json = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -replace '\s','')))
          $actual = [string](($json | ConvertFrom-Json).version)
          if ($actual -ne $expected) { throw "Published plugin version mismatch. Expected $expected, got $actual." }
          Write-Host "Published plugin version verified: $actual" -ForegroundColor Green
