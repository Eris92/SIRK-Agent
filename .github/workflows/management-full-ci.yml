name: SIRK Agent Full Management CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/management-full-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-management-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish runtime reporter and CLI
        shell: pwsh
        run: |
          dotnet publish src/SirkAgent.Service/SirkAgent.Service.csproj -c Release -r win-x64 --self-contained false -p:InformationalVersion=1.0.1+${{ github.sha }} -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Report/SirkAgent.Report.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Cli/SirkAgent.Cli.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Session/SirkAgent.Session.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime/Session
          dotnet publish src/SirkAgent.BrowserHost/SirkAgent.BrowserHost.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Watchdog/SirkAgent.Watchdog.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          Copy-Item tools/package/*.ps1 artifacts/SIRK-Agent-Runtime/ -Force

      - name: Generate integrity manifest and launchers
        shell: pwsh
        run: |
          $runtime = Resolve-Path artifacts/SIRK-Agent-Runtime
          Copy-Item browser-extension artifacts/SIRK-Agent-Runtime/BrowserExtension -Recurse -Force
          $protected = @('SirkAgent.Service.exe','SirkAgent.Service.dll','SirkAgent.Policy.dll','SirkAgent.Report.exe','sirkctl.exe','Session/SirkAgent.Session.exe','Session/SirkAgent.Session.dll','SirkAgent.BrowserHost.exe','SirkAgent.BrowserHost.dll','SirkAgent.Watchdog.exe','SirkAgent.Watchdog.dll')
          $files = foreach ($name in $protected) {
            $path = Join-Path $runtime $name
            if (-not (Test-Path $path)) { throw "Missing protected file $name" }
            @{ path = $name; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash }
          }
          @{ files = $files } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $runtime 'integrity-manifest.json') -Encoding UTF8
          @{ product='SIRK Agent'; version='1.0.1'; commit='${{ github.sha }}'; runtime='win-x64'; requiredRuntime='.NET 8 x64'; selfContained=$false } | ConvertTo-Json | Set-Content (Join-Path $runtime 'build-manifest.json') -Encoding UTF8
          '@echo off
          cd /d "%~dp0"
          sirkctl.exe status
          pause' | Set-Content (Join-Path $runtime 'STATUS.cmd') -Encoding ascii
          '@echo off
          cd /d "%~dp0"
          sirkctl.exe create-test-policy
          sirkctl.exe process
          pause' | Set-Content (Join-Path $runtime 'CREATE-AND-APPLY-TEST-POLICY.cmd') -Encoding ascii
          '@echo off
          cd /d "%~dp0"
          sirkctl.exe create-test-recovery
          sirkctl.exe process
          pause' | Set-Content (Join-Path $runtime 'CREATE-AND-APPLY-TEST-RECOVERY.cmd') -Encoding ascii

      - name: Validate non-empty status serialization
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $root -ItemType Directory -Force | Out-Null
          @{ timestampUtc=(Get-Date).ToUniversalTime(); status='Healthy'; code='POLICY_INBOX_IDLE'; acceptedPolicies=0; rejectedPolicies=0; integrityVerified=$true; integrityCode='INTEGRITY_OK' } | ConvertTo-Json | Set-Content (Join-Path $root 'management-state.json') -Encoding UTF8
          @{ timestampUtc=(Get-Date).ToUniversalTime(); tenantId='investa'; deviceId='ci-device'; stateStatus='OK'; tamperDetected=$false; quarantineActive=$false } | ConvertTo-Json | Set-Content (Join-Path $root 'heartbeat-latest.json') -Encoding UTF8
          @{ overallHealth='Healthy'; security=@{ state='Operational'; reason='OK' }; modules=@() } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $root 'security-state.json') -Encoding UTF8
          @{ active=$false; detectionCount=0 } | ConvertTo-Json | Set-Content (Join-Path $root 'quarantine-status.json') -Encoding UTF8
          $statusText = ./artifacts/SIRK-Agent-Runtime/sirkctl.exe status | Out-String
          $statusText | Set-Content artifacts/status-serialization.json
          if ([string]::IsNullOrWhiteSpace($statusText) -or $statusText.Trim() -eq '{}') { throw 'sirkctl status returned an empty object.' }
          $status = $statusText | ConvertFrom-Json
          if (-not $status.ok -or -not $status.management -or -not $status.heartbeat -or -not $status.security -or -not $status.quarantine) { throw 'sirkctl status did not serialize all state sections.' }
          if ($status.management.integrityCode -ne 'INTEGRITY_OK') { throw 'sirkctl status changed management state data.' }
          Remove-Item $root -Recurse -Force

      - name: Install clean Windows service
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/Install-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent CI"
          (Get-Service SirkAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))

      - name: Validate signed policy
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          $heartbeatPath = Join-Path $root 'heartbeat-latest.json'
          $heartbeatReady = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $heartbeatPath) {
              try {
                $heartbeat = Get-Content $heartbeatPath -Raw | ConvertFrom-Json
                if (-not [string]::IsNullOrWhiteSpace($heartbeat.deviceId)) { $heartbeatReady = $true; break }
              } catch { }
            }
          }
          if (-not $heartbeatReady) { throw 'Heartbeat with deviceId was not ready within 45 seconds.' }
          $create = Start-Process -FilePath ./artifacts/SIRK-Agent-Runtime/sirkctl.exe -ArgumentList 'create-test-policy' -Wait -PassThru -NoNewWindow
          if ($create.ExitCode -ne 0) { throw "create-test-policy failed with exit code $($create.ExitCode)." }
          $process = Start-Process -FilePath ./artifacts/SIRK-Agent-Runtime/sirkctl.exe -ArgumentList 'process' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "sirkctl process failed with exit code $($process.ExitCode)." }
          $policyReady = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            $activeExists = Test-Path (Join-Path $root 'active-policy.json')
            $acceptedExists = @(Get-ChildItem (Join-Path $root 'Archive\Accepted') -Filter '*.accepted.json' -ErrorAction SilentlyContinue).Count -gt 0
            if ($activeExists -and $acceptedExists) { $policyReady = $true; break }
          }
          if (-not $policyReady) { throw 'Signed policy was not activated and archived within 45 seconds.' }
          $active = Get-Content (Join-Path $root 'active-policy.json') -Raw | ConvertFrom-Json
          if ($active.policyId -notlike 'test-policy-*') { throw "Unexpected active policy: $($active.policyId)" }

      - name: Validate replay rejection
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          $accepted = Get-ChildItem (Join-Path $root 'Archive\Accepted') -Filter '*.accepted.json' | Select-Object -First 1
          if (-not $accepted) { throw 'No accepted policy was available for replay test.' }
          Copy-Item $accepted.FullName (Join-Path $root 'Incoming\replay.policy.json')
          $process = Start-Process -FilePath ./artifacts/SIRK-Agent-Runtime/sirkctl.exe -ArgumentList 'process' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Replay process command failed with exit code $($process.ExitCode)." }
          $rejected = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            $rejectedArchive = @(Get-ChildItem (Join-Path $root 'Archive\Rejected') -Filter '*.rejected.json' -ErrorAction SilentlyContinue).Count -gt 0
            if ($rejectedArchive) { $rejected = $true; break }
          }
          if (-not $rejected) { throw 'Replay policy was not moved to the rejected archive.' }

      - name: Validate signed recovery action
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          Set-Content (Join-Path $root 'quarantine-state.bin') 'test-placeholder'
          Set-Content (Join-Path $root 'tamper-event-latest.json') '{}'
          ./artifacts/SIRK-Agent-Runtime/sirkctl.exe create-test-recovery
          ./artifacts/SIRK-Agent-Runtime/sirkctl.exe process
          $recovered = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path (Join-Path $root 'quarantine-state.bin')) -and
                -not (Test-Path (Join-Path $root 'tamper-event-latest.json')) -and
                (Get-ChildItem (Join-Path $root 'Archive\Recovery') -ErrorAction SilentlyContinue)) {
              $recovered = $true
              break
            }
          }
          if (-not $recovered) { throw 'Signed recovery did not archive quarantine and tamper state.' }

      - name: Validate integrity failure detection
        shell: pwsh
        run: |
          $installed = Join-Path $env:ProgramFiles 'SIRK Agent CI'
          $cli = Join-Path $installed 'sirkctl.exe'
          Stop-Service SirkAgentWatchdog -Force
          (Get-Service SirkAgentWatchdog).WaitForStatus('Stopped',[TimeSpan]::FromSeconds(30))
          Stop-Service SirkAgent -Force
          (Get-Service SirkAgent).WaitForStatus('Stopped',[TimeSpan]::FromSeconds(30))
          try {
            $clean = Start-Process -FilePath $cli -ArgumentList 'verify-integrity' -Wait -PassThru -NoNewWindow
            if ($clean.ExitCode -ne 0) { throw 'Clean integrity verification failed.' }
            $target = Join-Path $installed 'SirkAgent.Report.exe'
            $backup = "$target.ci-backup"
            Copy-Item $target $backup -Force
            Add-Content $target 'tamper'
            $tampered = Start-Process -FilePath $cli -ArgumentList 'verify-integrity' -Wait -PassThru -NoNewWindow
            Copy-Item $backup $target -Force
            Remove-Item $backup -Force
            if ($tampered.ExitCode -eq 0) { throw 'Modified executable was not detected.' }
            $restored = Start-Process -FilePath $cli -ArgumentList 'verify-integrity' -Wait -PassThru -NoNewWindow
            if ($restored.ExitCode -ne 0) { throw 'Integrity did not recover after file restoration.' }
          }
          finally {
            Start-Service SirkAgent
            (Get-Service SirkAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))
            Start-Service SirkAgentWatchdog
            (Get-Service SirkAgentWatchdog).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))
          }

      - name: Validate diagnostics and TestBundle
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Report.exe --no-open
          $out = Join-Path $PWD 'artifacts/TestBundles'
          ./artifacts/SIRK-Agent-Runtime/Collect-SirkAgent-TestBundle.ps1 -OutputDirectory $out
          if (-not (Get-ChildItem $out -Filter '*.zip')) { throw 'TestBundle was not generated.' }

      - name: Validate signed update package
        shell: pwsh
        run: |
          $runtime = Resolve-Path artifacts/SIRK-Agent-Runtime
          $cli = Join-Path $env:ProgramFiles 'SIRK Agent CI\sirkctl.exe'
          & $cli create-test-update-manifest --package $runtime --version 1.0.1-test-ci
          if ($LASTEXITCODE -ne 0) { throw 'Test update manifest generation failed.' }
          & $cli verify-update --package $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Signed update package verification failed.' }
          Remove-Item (Join-Path $runtime 'update-manifest.json') -Force

      - name: Uninstall service and create package
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/Uninstall-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent CI" -Confirm:$false
          Compress-Archive -Path artifacts/SIRK-Agent-Runtime/* -DestinationPath artifacts/SIRK-Agent-1.0.1-win-x64.zip -CompressionLevel Optimal -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-1.0.1-win-x64
          path: |
            artifacts/SIRK-Agent-1.0.1-win-x64.zip
            artifacts/SIRK-Agent-Runtime/**
            artifacts/TestBundles/*.zip
            artifacts/status-serialization.json
          if-no-files-found: error
