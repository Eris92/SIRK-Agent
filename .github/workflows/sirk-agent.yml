name: SIRK-Agent

on:
  push:
    branches:
      - main
      - smp-agent-foundation
    paths:
      - "SIRK-Agent/**"
      - ".github/workflows/sirk-agent.yml"
  pull_request:
    paths:
      - "SIRK-Agent/**"
      - ".github/workflows/sirk-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj 2>&1 | Tee-Object restore.log

      - name: Build
        shell: pwsh
        run: dotnet build SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-restore 2>&1 | Tee-Object build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-build-logs
          path: |
            restore.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish
        run: dotnet publish SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-build --output artifacts/SIRK-Agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-win-x64
          path: artifacts/SIRK-Agent
          if-no-files-found: error
          retention-days: 14
