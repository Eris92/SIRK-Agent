name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native WorkspaceHost and plugin
        shell: pwsh
        run: ./tools/build.ps1 -Configuration Release -Runtime win-x64

      - name: Verify no Visual C++ runtime dependency
        shell: pwsh
        run: |
          $exe = Resolve-Path './artifacts/WorkspaceHost-win-x64/WorkspaceHost.exe'
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin.exe not found on GitHub runner.' }
          $dependencies = & $dumpbin /dependents $exe 2>&1 | Out-String
          Write-Host $dependencies
          if ($dependencies -match '(?i)VCRUNTIME\d*|MSVCP\d*|CONCRT\d*') {
            throw 'WorkspaceHost still depends on Visual C++ Redistributable DLLs.'
          }

      - name: Verify WorkspaceHost heartbeat
        shell: pwsh
        run: ./tools/test-workspacehost.ps1 -ExePath ./artifacts/WorkspaceHost-win-x64/WorkspaceHost.exe

      - name: Package WorkspaceHost
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/WorkspaceHost-win-x64/* -DestinationPath ./artifacts/WorkspaceHost-win-x64.zip -Force

      - name: Upload WorkspaceHost
        uses: actions/upload-artifact@v4
        with:
          name: WorkspaceHost-win-x64
          path: artifacts/WorkspaceHost-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload MeshCentral plugin
        uses: actions/upload-artifact@v4
        with:
          name: MeshCentral-Workspace-Plugin-0.2.0
          path: artifacts/MeshCentral-Workspace-Plugin-0.2.0.zip
          if-no-files-found: error
          retention-days: 14
