name: SIRK-Agent

on:
  push:
    branches:
      - main
      - smp-agent-foundation
    paths:
      - "SIRK-Agent/**"
      - ".github/workflows/sirk-agent.yml"
  pull_request:
    paths:
      - "SIRK-Agent/**"
      - ".github/workflows/sirk-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj 2>&1 | Tee-Object restore-agent.log
          dotnet restore SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj 2>&1 | Tee-Object restore-client.log
          dotnet restore SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj 2>&1 | Tee-Object restore-tests.log

      - name: Build projects
        shell: pwsh
        run: |
          dotnet build SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-restore 2>&1 | Tee-Object build-agent.log
          dotnet build SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj --configuration Release --no-restore 2>&1 | Tee-Object build-client.log
          dotnet build SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj --configuration Release --no-restore 2>&1 | Tee-Object build-tests.log

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem SIRK-Agent/scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }

      - name: Run IPC integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Resolve-Path 'SIRK-Agent/src/SIRK.Agent/bin/Release/net8.0-windows/win-x64/SIRK-Agent.exe'
          dotnet run --project SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj --configuration Release --no-build -- $agent 2>&1 | Tee-Object integration-tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-build-logs
          path: |
            restore-agent.log
            restore-client.log
            restore-tests.log
            build-agent.log
            build-client.log
            build-tests.log
            integration-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish agent
        run: dotnet publish SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-build --output artifacts/SIRK-Agent

      - name: Publish IPC client
        run: dotnet publish SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj --configuration Release --no-build --output artifacts/SIRK-Agent-Client

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-win-x64
          path: artifacts/SIRK-Agent
          if-no-files-found: error
          retention-days: 14

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-Client-win-x64
          path: artifacts/SIRK-Agent-Client
          if-no-files-found: error
          retention-days: 14
