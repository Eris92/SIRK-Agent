name: Apply empty trust bootstrap fix

on:
  push:
    branches:
      - feat/canonical-agent-management-v1

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-agent-management-v1
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply empty trust bootstrap fix
        shell: pwsh
        run: python .github/scripts/apply_empty_trust_bootstrap_fix.py
      - name: Build and validate Agent
        shell: pwsh
        run: |
          dotnet restore src/SirkAgent.Service/SirkAgent.Service.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Agent restore failed.' }
          dotnet build src/SirkAgent.Service/SirkAgent.Service.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Agent build failed.' }
          & pwsh -NoProfile -File tests/canonical-agent-management-v1-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Agent management contract failed.' }
      - name: Commit product change
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-empty-trust-bootstrap-fix.yml -Force
          Remove-Item .github/scripts/apply_empty_trust_bootstrap_fix.py -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bootstrap policy trust from an empty store'
          git push origin HEAD:feat/canonical-agent-management-v1
