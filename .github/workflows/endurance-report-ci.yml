name: SIRK Agent Endurance Report CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/endurance-report-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endurance-report-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish 0.3.5 runtime
        shell: pwsh
        run: |
          dotnet publish src/SirkAgent.Service/SirkAgent.Service.csproj -c Release -r win-x64 --self-contained false -p:InformationalVersion=1.0.0+${{ github.sha }} -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Report/SirkAgent.Report.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Cli/SirkAgent.Cli.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Session/SirkAgent.Session.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          Copy-Item tools/package/*.ps1 artifacts/SIRK-Agent-Runtime/ -Force
          $runtime = Resolve-Path artifacts/SIRK-Agent-Runtime
          $protected = @('SirkAgent.Service.exe','SirkAgent.Service.dll','SirkAgent.Policy.dll','SirkAgent.Report.exe','sirkctl.exe','SirkAgent.Session.exe','SirkAgent.Session.dll')
          $files = foreach ($name in $protected) {
            $path = Join-Path $runtime $name
            @{ path = $name; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash }
          }
          @{ files = $files } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $runtime 'integrity-manifest.json') -Encoding UTF8
          @{ product='SIRK Agent'; version='1.0.0'; commit='${{ github.sha }}'; runtime='win-x64'; requiredRuntime='.NET 8 x64'; selfContained=$false } | ConvertTo-Json | Set-Content (Join-Path $runtime 'build-manifest.json') -Encoding UTF8

      - name: Install with accelerated endurance interval
        shell: pwsh
        run: |
          [Environment]::SetEnvironmentVariable('SIRK_ENDURANCE_INTERVAL_SECONDS','5','Machine')
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          ./artifacts/SIRK-Agent-Runtime/Install-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent Endurance CI"
          $usersSid = [System.Security.Principal.SecurityIdentifier]::new('S-1-5-32-545')
          $usersRules = (Get-Acl (Join-Path $env:ProgramData 'SIRK\Agent')).Access | Where-Object {
            try {
              $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -eq $usersSid.Value
            } catch {
              $false
            }
          }
          if (-not $usersRules) { throw 'Missing read-only Users ACL on the Agent data directory.' }
          $writeMask = [System.Security.AccessControl.FileSystemRights]::Write
          if ($usersRules | Where-Object {
            $_.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
            (($_.FileSystemRights -band $writeMask) -ne 0)
          }) { throw 'Ordinary Users retain write access to the Agent data directory.' }
          (Get-Service SirkAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))

      - name: Validate reports and SCM recovery
        shell: pwsh
        run: |
          function Assert-Ci([bool]$Condition, [string]$Message) {
            if (-not $Condition) {
              Write-Output "::error title=Endurance validation failed::$Message"
              throw $Message
            }
          }

          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 1
            $summaryPath = Join-Path $root 'endurance-summary.json'
            if (Test-Path $summaryPath) {
              $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
              if ($summary.sampleCount -ge 4) { $ready = $true; break }
            }
          }
          Assert-Ci $ready 'Endurance summary did not collect four samples.'
          $summary | ConvertTo-Json -Depth 8 | Write-Output
          Assert-Ci (Test-Path (Join-Path $root 'endurance-report.html')) 'Endurance HTML report missing.'
          Assert-Ci ($summary.status -eq 'Healthy' -and -not $summary.memoryLeakSuspected) "Endurance summary is not healthy: status=$($summary.status), memoryLeakSuspected=$($summary.memoryLeakSuspected), unhealthySamples=$($summary.unhealthySamples), sampleGaps=$($summary.sampleGaps)."

          $before = Get-CimInstance Win32_Service -Filter "Name='SirkAgent'"
          $oldPid = [int]$before.ProcessId
          Assert-Ci ($before.State -eq 'Running' -and $oldPid -gt 0) "Service was not running before SCM recovery test: state=$($before.State), pid=$oldPid."
          & sc.exe qfailure SirkAgent
          Stop-Process -Id $oldPid -Force
          $recovered = $false
          for ($i = 0; $i -lt 70; $i++) {
            Start-Sleep 1
            $service = Get-CimInstance Win32_Service -Filter "Name='SirkAgent'"
            if ($service.State -eq 'Running' -and $service.ProcessId -gt 0 -and $service.ProcessId -ne $oldPid) { $recovered = $true; break }
          }
          Assert-Ci $recovered "SCM did not recover the killed service process: oldPid=$oldPid, state=$($service.State), pid=$($service.ProcessId)."

          $samplesRecovered = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 1
            $after = Get-Content (Join-Path $root 'endurance-summary.json') -Raw | ConvertFrom-Json
            if ($after.processRestarts -ge 1) { $samplesRecovered = $true; break }
          }
          Assert-Ci $samplesRecovered "Endurance report did not record process restart: oldPid=$oldPid, newPid=$($service.ProcessId), samples=$($after.sampleCount), recordedRestarts=$($after.processRestarts)."
          Assert-Ci (-not [string]::IsNullOrWhiteSpace([string]$after.deviceId)) 'Endurance summary lost Device ID.'
          Copy-Item (Join-Path $root 'endurance-summary.json') artifacts/
          Copy-Item (Join-Path $root 'endurance-report.html') artifacts/
          Copy-Item (Join-Path $root 'endurance-samples.jsonl') artifacts/

      - name: Capture endurance diagnostics
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          New-Item artifacts/EnduranceDiagnostics -ItemType Directory -Force | Out-Null
          foreach ($name in @('endurance-summary.json','endurance-report.html','endurance-samples.jsonl','runtime-health.json','heartbeat-latest.json','security-state.json','agent-events.jsonl')) {
            $path = Join-Path $root $name
            if (Test-Path $path) { Copy-Item $path artifacts/EnduranceDiagnostics/ -Force }
          }
          Get-CimInstance Win32_Service -Filter "Name='SirkAgent'" |
            Select-Object Name,State,Status,ProcessId,StartMode,ExitCode |
            ConvertTo-Json -Depth 5 |
            Set-Content artifacts/EnduranceDiagnostics/service-state.json
          & sc.exe qfailure SirkAgent 2>&1 |
            Set-Content artifacts/EnduranceDiagnostics/service-recovery.txt

      - name: Cleanup test service
        if: always()
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/Uninstall-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent Endurance CI" -Confirm:$false -ErrorAction SilentlyContinue
          [Environment]::SetEnvironmentVariable('SIRK_ENDURANCE_INTERVAL_SECONDS',$null,'Machine')

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/SIRK-Agent-Runtime/* -DestinationPath artifacts/SIRK-Agent-1.0.0-win-x64.zip -CompressionLevel Optimal -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-1.0.0-win-x64
          path: |
            artifacts/SIRK-Agent-1.0.0-win-x64.zip
            artifacts/SIRK-Agent-Runtime/**
            artifacts/endurance-summary.json
            artifacts/endurance-report.html
            artifacts/endurance-samples.jsonl
          if-no-files-found: error

      - name: Upload endurance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-1.0.0-endurance-diagnostics
          path: artifacts/EnduranceDiagnostics/**
          if-no-files-found: warn
