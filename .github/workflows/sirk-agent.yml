name: SIRK-Agent

on:
  push:
    branches:
      - main
      - smp-agent-foundation
    paths:
      - "SIRK-Agent/**"
      - "SIRK-MeshAdapter/**"
      - ".github/workflows/sirk-agent.yml"
  pull_request:
    paths:
      - "SIRK-Agent/**"
      - "SIRK-MeshAdapter/**"
      - ".github/workflows/sirk-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-LoggedNative {
            param([string]$LogPath, [scriptblock]$Command)
            & $Command 2>&1 | Tee-Object -FilePath $LogPath
            if ($LASTEXITCODE -ne 0) { throw "Native command failed with exit code $LASTEXITCODE. See $LogPath" }
          }
          Invoke-LoggedNative 'restore-agent.log' { dotnet restore SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj }
          Invoke-LoggedNative 'restore-client.log' { dotnet restore SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj }
          Invoke-LoggedNative 'restore-tests.log' { dotnet restore SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj }
          Invoke-LoggedNative 'restore-mesh-adapter.log' { dotnet restore SIRK-MeshAdapter/src/SIRK.MeshAdapter/SIRK.MeshAdapter.csproj }

      - name: Build projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-LoggedNative {
            param([string]$LogPath, [scriptblock]$Command)
            & $Command 2>&1 | Tee-Object -FilePath $LogPath
            if ($LASTEXITCODE -ne 0) { throw "Native command failed with exit code $LASTEXITCODE. See $LogPath" }
          }
          Invoke-LoggedNative 'build-agent.log' { dotnet build SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-restore }
          Invoke-LoggedNative 'build-client.log' { dotnet build SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj --configuration Release --no-restore }
          Invoke-LoggedNative 'build-tests.log' { dotnet build SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj --configuration Release --no-restore }
          Invoke-LoggedNative 'build-mesh-adapter.log' { dotnet build SIRK-MeshAdapter/src/SIRK.MeshAdapter/SIRK.MeshAdapter.csproj --configuration Release --no-restore }

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem SIRK-Agent,SIRK-MeshAdapter -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }

      - name: Run agent IPC integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Resolve-Path 'SIRK-Agent/src/SIRK.Agent/bin/Release/net8.0-windows/win-x64/SIRK-Agent.exe'
          dotnet run --project SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj --configuration Release --no-build -- $agent 2>&1 | Tee-Object integration-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Agent integration tests failed with exit code $LASTEXITCODE." }

      - name: Run Mesh adapter integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Resolve-Path 'SIRK-Agent/src/SIRK.Agent/bin/Release/net8.0-windows/win-x64/SIRK-Agent.exe'
          $adapter = Resolve-Path 'SIRK-MeshAdapter/src/SIRK.MeshAdapter/bin/Release/net8.0-windows/win-x64/SIRK-MeshAdapter.exe'
          & 'SIRK-MeshAdapter/tests/Invoke-MeshAdapterIntegration.ps1' -AgentPath $agent -AdapterPath $adapter 2>&1 | Tee-Object mesh-adapter-integration.log
          if ($LASTEXITCODE -ne 0) { throw "Mesh adapter integration tests failed with exit code $LASTEXITCODE." }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-build-logs
          path: |
            restore-agent.log
            restore-client.log
            restore-tests.log
            restore-mesh-adapter.log
            build-agent.log
            build-client.log
            build-tests.log
            build-mesh-adapter.log
            integration-tests.log
            mesh-adapter-integration.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish agent
        run: dotnet publish SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-build --output artifacts/SIRK-Agent

      - name: Publish IPC client
        run: dotnet publish SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj --configuration Release --no-build --output artifacts/SIRK-Agent-Client

      - name: Publish Mesh adapter
        run: dotnet publish SIRK-MeshAdapter/src/SIRK.MeshAdapter/SIRK.MeshAdapter.csproj --configuration Release --no-build --output artifacts/SIRK-MeshAdapter

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-win-x64
          path: artifacts/SIRK-Agent
          if-no-files-found: error
          retention-days: 14

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-Client-win-x64
          path: artifacts/SIRK-Agent-Client
          if-no-files-found: error
          retention-days: 14

      - name: Upload Mesh adapter artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-MeshAdapter-win-x64
          path: artifacts/SIRK-MeshAdapter
          if-no-files-found: error
          retention-days: 14
