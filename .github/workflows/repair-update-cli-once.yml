name: Repair Agent update CLI once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-update-cli-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply exact constructor repair and build CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/SirkAgent.Cli/Program.cs'
          $text = Get-Content $path -Raw -Encoding UTF8
          $oldFiles = @'
        .Select(path => new UpdateManifestFile(
            Path.GetRelativePath(package, path).Replace('\\', '/'),
            Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(path)))))
'@
          $newFiles = @'
        .Select(path => new UpdateManifestFile(
            Path.GetRelativePath(package, path).Replace('\\', '/'),
            new FileInfo(path).Length,
            Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(path)))))
'@
          $oldManifest = @'
    var unsigned = new UpdateManifest(1, "SIRK Agent", version, "win-x64", files,
        new PolicySignature { Algorithm = "ES256", KeyId = "sirk-test-es256", Value = "pending" });
'@
          $newManifest = @'
    var unsigned = new UpdateManifest(1, "sirk-agent", "SIRK Agent", version, "win-x64", files,
        new PolicySignature { Algorithm = "ES256", KeyId = "sirk-test-es256", Value = "pending" });
'@
          if (-not $text.Contains($oldFiles)) { throw 'Expected legacy UpdateManifestFile constructor block not found.' }
          if (-not $text.Contains($oldManifest)) { throw 'Expected legacy UpdateManifest constructor block not found.' }
          $text = $text.Replace($oldFiles, $newFiles).Replace($oldManifest, $newManifest)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          dotnet build src/SirkAgent.Cli/SirkAgent.Cli.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Agent CLI build failed: $LASTEXITCODE" }
      - name: Commit exact source repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SirkAgent.Cli/Program.cs
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'No Agent CLI repair was produced.' }
          git commit -m 'fix(cli): align test update manifest with signed schema'
          git push origin HEAD:main
