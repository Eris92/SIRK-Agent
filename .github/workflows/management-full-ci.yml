name: SIRK Agent Full Management CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/management-full-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-management-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish runtime reporter and CLI
        shell: pwsh
        run: |
          dotnet publish src/SirkAgent.Service/SirkAgent.Service.csproj -c Release -r win-x64 --self-contained false -p:InformationalVersion=0.3.1-test+${{ github.sha }} -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Report/SirkAgent.Report.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Cli/SirkAgent.Cli.csproj -c Release -r win-x64 --self-contained false -o artifacts/SIRK-Agent-Runtime
          Copy-Item tools/package/*.ps1 artifacts/SIRK-Agent-Runtime/ -Force

      - name: Generate integrity manifest and launchers
        shell: pwsh
        run: |
          $runtime = Resolve-Path artifacts/SIRK-Agent-Runtime
          $protected = @('SirkAgent.Service.exe','SirkAgent.Service.dll','SirkAgent.Policy.dll','SirkAgent.Report.exe','sirkctl.exe')
          $files = foreach ($name in $protected) {
            $path = Join-Path $runtime $name
            if (-not (Test-Path $path)) { throw "Missing protected file $name" }
            @{ path = $name; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash }
          }
          @{ files = $files } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $runtime 'integrity-manifest.json') -Encoding UTF8
          @{ product='SIRK Agent'; version='0.3.1-test'; commit='${{ github.sha }}'; runtime='win-x64'; requiredRuntime='.NET 8 x64' } | ConvertTo-Json | Set-Content (Join-Path $runtime 'build-manifest.json') -Encoding UTF8
          '@echo off
          cd /d "%~dp0"
          sirkctl.exe status
          pause' | Set-Content (Join-Path $runtime 'STATUS.cmd') -Encoding ascii
          '@echo off
          cd /d "%~dp0"
          sirkctl.exe create-test-policy
          sirkctl.exe process
          pause' | Set-Content (Join-Path $runtime 'CREATE-AND-APPLY-TEST-POLICY.cmd') -Encoding ascii
          '@echo off
          cd /d "%~dp0"
          sirkctl.exe create-test-recovery
          sirkctl.exe process
          pause' | Set-Content (Join-Path $runtime 'CREATE-AND-APPLY-TEST-RECOVERY.cmd') -Encoding ascii

      - name: Validate clean one-shot Agent Core startup
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          $once = Start-Process ./artifacts/SIRK-Agent-Runtime/SirkAgent.Service.exe -ArgumentList '--once' -Wait -PassThru -NoNewWindow
          if ($once.ExitCode -ne 0) { throw "Agent --once failed with exit code $($once.ExitCode)." }
          $heartbeatPath = Join-Path $root 'heartbeat-latest.json'
          $securityPath = Join-Path $root 'security-state.json'
          if (-not (Test-Path $heartbeatPath)) { throw 'Heartbeat was not created by --once.' }
          if (-not (Test-Path $securityPath)) { throw 'Security state was not created by --once.' }
          $heartbeat = Get-Content $heartbeatPath -Raw | ConvertFrom-Json
          $security = Get-Content $securityPath -Raw | ConvertFrom-Json
          if ($heartbeat.tamperDetected -or $heartbeat.quarantineActive) { throw 'One-shot startup reported tamper or quarantine.' }
          if ($security.overallHealth -ne 'Healthy') { throw "One-shot Agent Core health: $($security.overallHealth)" }

      - name: Install Windows service
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/Install-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent CI"
          (Get-Service SirkAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))
          Start-Sleep -Seconds 8

      - name: Validate complete local status and signed policy
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          $statusText = ./artifacts/SIRK-Agent-Runtime/sirkctl.exe status | Out-String
          $statusText | Set-Content artifacts/status.json
          if ([string]::IsNullOrWhiteSpace($statusText) -or $statusText.Trim() -eq '{}') { throw 'sirkctl status returned an empty object.' }
          $status = $statusText | ConvertFrom-Json
          if (-not $status.ok) { throw 'sirkctl status reported ok=false.' }
          if (-not $status.management -or -not $status.heartbeat -or -not $status.security) { throw 'sirkctl status is missing management, heartbeat or security data.' }
          if ($status.management.integrityCode -ne 'INTEGRITY_OK') { throw "Unexpected status integrity: $($status.management.integrityCode)" }
          ./artifacts/SIRK-Agent-Runtime/sirkctl.exe create-test-policy
          ./artifacts/SIRK-Agent-Runtime/sirkctl.exe process
          Start-Sleep -Seconds 18
          if (-not (Test-Path (Join-Path $root 'active-policy.json'))) { throw 'Signed policy was not activated.' }
          $management = Get-Content (Join-Path $root 'management-state.json') -Raw | ConvertFrom-Json
          if ($management.acceptedPolicies -lt 1) { throw 'Accepted policy counter was not updated.' }
          if ($management.lastPolicyId -notlike 'test-policy-*') { throw "Unexpected policy: $($management.lastPolicyId)" }

      - name: Validate replay rejection
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          $accepted = Get-ChildItem (Join-Path $root 'Archive\Accepted') -Filter '*.accepted.json' | Select-Object -First 1
          Copy-Item $accepted.FullName (Join-Path $root 'Incoming\replay.policy.json')
          Start-Sleep -Seconds 18
          $management = Get-Content (Join-Path $root 'management-state.json') -Raw | ConvertFrom-Json
          if ($management.rejectedPolicies -lt 1) { throw 'Replay policy was not rejected.' }

      - name: Validate signed recovery action
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'SIRK\Agent'
          Set-Content (Join-Path $root 'quarantine-state.bin') 'test-placeholder'
          Set-Content (Join-Path $root 'tamper-event-latest.json') '{}'
          ./artifacts/SIRK-Agent-Runtime/sirkctl.exe create-test-recovery
          ./artifacts/SIRK-Agent-Runtime/sirkctl.exe process
          $recovered = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path (Join-Path $root 'quarantine-state.bin')) -and
                -not (Test-Path (Join-Path $root 'tamper-event-latest.json')) -and
                (Get-ChildItem (Join-Path $root 'Archive\Recovery') -ErrorAction SilentlyContinue)) {
              $recovered = $true
              break
            }
          }
          if (-not $recovered) { throw 'Signed recovery did not archive quarantine and tamper state.' }

      - name: Validate integrity failure detection
        shell: pwsh
        run: |
          $installed = Join-Path $env:ProgramFiles 'SIRK Agent CI'
          $cli = Join-Path $installed 'sirkctl.exe'
          Stop-Service SirkAgent -Force
          (Get-Service SirkAgent).WaitForStatus('Stopped',[TimeSpan]::FromSeconds(30))
          try {
            $clean = Start-Process -FilePath $cli -ArgumentList 'verify-integrity' -Wait -PassThru -NoNewWindow
            if ($clean.ExitCode -ne 0) { throw 'Clean integrity verification failed.' }
            $target = Join-Path $installed 'SirkAgent.Report.exe'
            $backup = "$target.ci-backup"
            Copy-Item $target $backup -Force
            Add-Content $target 'tamper'
            $tampered = Start-Process -FilePath $cli -ArgumentList 'verify-integrity' -Wait -PassThru -NoNewWindow
            Copy-Item $backup $target -Force
            Remove-Item $backup -Force
            if ($tampered.ExitCode -eq 0) { throw 'Modified executable was not detected.' }
            $restored = Start-Process -FilePath $cli -ArgumentList 'verify-integrity' -Wait -PassThru -NoNewWindow
            if ($restored.ExitCode -ne 0) { throw 'Integrity did not recover after file restoration.' }
          }
          finally {
            Start-Service SirkAgent
            (Get-Service SirkAgent).WaitForStatus('Running',[TimeSpan]::FromSeconds(30))
          }

      - name: Validate diagnostics and TestBundle
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Report.exe --no-open
          $out = Join-Path $PWD 'artifacts/TestBundles'
          ./artifacts/SIRK-Agent-Runtime/Collect-SirkAgent-TestBundle.ps1 -OutputDirectory $out
          if (-not (Get-ChildItem $out -Filter '*.zip')) { throw 'TestBundle was not generated.' }

      - name: Uninstall service and create package
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/Uninstall-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent CI" -Confirm:$false
          Compress-Archive -Path artifacts/SIRK-Agent-Runtime/* -DestinationPath artifacts/SIRK-Agent-0.3.1-test-win-x64.zip -CompressionLevel Optimal -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-0.3.1-test-win-x64
          path: |
            artifacts/SIRK-Agent-0.3.1-test-win-x64.zip
            artifacts/SIRK-Agent-Runtime/**
            artifacts/TestBundles/*.zip
          if-no-files-found: error