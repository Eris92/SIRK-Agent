name: SIRK Agent Enrollment Readiness CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/package/Install-SirkAgent-WithUpdater.ps1'
      - 'tests/SirkAgent.PackageTests/EnrollmentReadiness.Tests.ps1'
      - '.github/workflows/enrollment-readiness-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package readiness gate
        shell: pwsh
        run: ./tests/SirkAgent.PackageTests/EnrollmentReadiness.Tests.ps1
