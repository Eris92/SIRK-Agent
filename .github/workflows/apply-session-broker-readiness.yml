name: Apply session broker readiness fix

on:
  push:
    branches:
      - fix/session-broker-readiness

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-broker-readiness
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply readiness fix
        shell: pwsh
        run: python .github/scripts/apply_session_broker_readiness.py
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore src/SirkAgent.Service/SirkAgent.Service.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Service restore failed.' }
          dotnet build src/SirkAgent.Service/SirkAgent.Service.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed.' }
          dotnet restore src/SirkAgent.Session/SirkAgent.Session.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Session restore failed.' }
          dotnet build src/SirkAgent.Session/SirkAgent.Session.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Session build failed.' }
      - name: Publish and probe broker pipe
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'sirk-session-readiness'
          dotnet publish src/SirkAgent.Session/SirkAgent.Session.csproj -c Release -r win-x64 `
            --self-contained false --no-restore -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Session publish failed.' }

          $runtimeConfig = Get-Content (Join-Path $publish 'SirkAgent.Session.runtimeconfig.json') -Raw
          if ($runtimeConfig -match 'Microsoft.WindowsDesktop.App') {
            throw 'Session broker regained a Windows Desktop Runtime dependency.'
          }

          $process = Start-Process -FilePath (Join-Path $publish 'SirkAgent.Session.exe') `
            -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Milliseconds 500
            if ($process.HasExited) {
              throw "Session broker exited before readiness probe. ExitCode=$($process.ExitCode)"
            }
            $sessionId = (Get-Process -Id $process.Id).SessionId
            $pipeName = "SIRK-Agent-Interactive-Session-$sessionId"
            $client = [System.IO.Pipes.NamedPipeClientStream]::new(
              '.', $pipeName, [System.IO.Pipes.PipeDirection]::InOut,
              [System.IO.Pipes.PipeOptions]::Asynchronous)
            try {
              $client.Connect(5000)
              if (-not $client.IsConnected) { throw 'Session broker pipe did not become ready.' }
            }
            finally { $client.Dispose() }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Run readiness contract
        shell: pwsh
        run: |
          & pwsh -NoProfile -File tests/session-broker-readiness-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Session broker readiness contract failed.' }
      - name: Commit product change
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-session-broker-readiness.yml -Force
          Remove-Item .github/scripts/apply_session_broker_readiness.py -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SirkAgent.Service/InteractiveSessionPipe.cs `
                  src/SirkAgent.Session/Program.cs `
                  tests/session-broker-readiness-contract.ps1 `
                  .github/scripts
          git commit -m 'fix: require ready session broker pipe'
          git push origin HEAD:fix/session-broker-readiness
