name: SIRK-Agent

on:
  push:
    branches:
      - main
      - smp-agent-foundation
    paths:
      - "SIRK-Agent/**"
      - "SIRK-MeshAdapter/**"
      - "SIRK-WorkspaceHost/**"
      - ".github/workflows/sirk-agent.yml"
  pull_request:
    paths:
      - "SIRK-Agent/**"
      - "SIRK-MeshAdapter/**"
      - "SIRK-WorkspaceHost/**"
      - ".github/workflows/sirk-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-LoggedNative {
            param([string]$LogPath, [scriptblock]$Command)
            & $Command 2>&1 | Tee-Object -FilePath $LogPath
            if ($LASTEXITCODE -ne 0) { throw "Native command failed with exit code $LASTEXITCODE. See $LogPath" }
          }
          Invoke-LoggedNative 'restore-agent.log' { dotnet restore SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj }
          Invoke-LoggedNative 'restore-client.log' { dotnet restore SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj }
          Invoke-LoggedNative 'restore-tests.log' { dotnet restore SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj }
          Invoke-LoggedNative 'restore-mesh-adapter.log' { dotnet restore SIRK-MeshAdapter/src/SIRK.MeshAdapter/SIRK.MeshAdapter.csproj }
          Invoke-LoggedNative 'restore-workspace-host.log' { dotnet restore SIRK-WorkspaceHost/src/SIRK.WorkspaceHost/SIRK.WorkspaceHost.csproj }

      - name: Build projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-LoggedNative {
            param([string]$LogPath, [scriptblock]$Command)
            & $Command 2>&1 | Tee-Object -FilePath $LogPath
            if ($LASTEXITCODE -ne 0) { throw "Native command failed with exit code $LASTEXITCODE. See $LogPath" }
          }
          Invoke-LoggedNative 'build-agent.log' { dotnet build SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-restore }
          Invoke-LoggedNative 'build-client.log' { dotnet build SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj --configuration Release --no-restore }
          Invoke-LoggedNative 'build-tests.log' { dotnet build SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj --configuration Release --no-restore }
          Invoke-LoggedNative 'build-mesh-adapter.log' { dotnet build SIRK-MeshAdapter/src/SIRK.MeshAdapter/SIRK.MeshAdapter.csproj --configuration Release --no-restore }
          Invoke-LoggedNative 'build-workspace-host.log' { dotnet build SIRK-WorkspaceHost/src/SIRK.WorkspaceHost/SIRK.WorkspaceHost.csproj --configuration Release --no-restore }

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem SIRK-Agent,SIRK-MeshAdapter,SIRK-WorkspaceHost -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message } }
          }

      - name: Run agent IPC integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Resolve-Path 'SIRK-Agent/src/SIRK.Agent/bin/Release/net8.0-windows/win-x64/SIRK-Agent.exe'
          dotnet run --project SIRK-Agent/tests/SIRK.Agent.IntegrationTests/SIRK.Agent.IntegrationTests.csproj --configuration Release --no-build -- $agent 2>&1 | Tee-Object integration-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Agent integration tests failed with exit code $LASTEXITCODE." }

      - name: Run Mesh adapter integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Resolve-Path 'SIRK-Agent/src/SIRK.Agent/bin/Release/net8.0-windows/win-x64/SIRK-Agent.exe'
          $adapter = Resolve-Path 'SIRK-MeshAdapter/src/SIRK.MeshAdapter/bin/Release/net8.0-windows/win-x64/SIRK-MeshAdapter.exe'
          & 'SIRK-MeshAdapter/tests/Invoke-MeshAdapterIntegration.ps1' -AgentPath $agent -AdapterPath $adapter 2>&1 | Tee-Object mesh-adapter-integration.log
          if ($LASTEXITCODE -ne 0) { throw "Mesh adapter integration tests failed with exit code $LASTEXITCODE." }

      - name: Validate WorkspaceHost argument rejection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostPath = Resolve-Path 'SIRK-WorkspaceHost/src/SIRK.WorkspaceHost/bin/Release/net8.0-windows/win-x64/SIRK-WorkspaceHost.exe'
          & $hostPath --session-id 0 --pipe-name invalid --token invalid 2>&1 | Tee-Object workspace-host-validation.log
          $exitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($exitCode -ne 2) { throw "WorkspaceHost did not reject invalid startup arguments. ExitCode=$exitCode" }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-build-logs
          path: |
            restore-*.log
            build-*.log
            integration-tests.log
            mesh-adapter-integration.log
            workspace-host-validation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish SIRK-Agent/src/SIRK.Agent/SIRK.Agent.csproj --configuration Release --no-build --output artifacts/SIRK-Agent
          dotnet publish SIRK-Agent/tools/SIRK.Agent.Client/SIRK.Agent.Client.csproj --configuration Release --no-build --output artifacts/SIRK-Agent-Client
          dotnet publish SIRK-MeshAdapter/src/SIRK.MeshAdapter/SIRK.MeshAdapter.csproj --configuration Release --no-build --output artifacts/SIRK-MeshAdapter
          dotnet publish SIRK-WorkspaceHost/src/SIRK.WorkspaceHost/SIRK.WorkspaceHost.csproj --configuration Release --no-build --output artifacts/SIRK-WorkspaceHost

      - name: Prepare test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'artifacts/SIRK-Agent-TestBundle'
          New-Item "$bundle/Agent","$bundle/Client","$bundle/MeshAdapter","$bundle/WorkspaceHost","$bundle/Scripts","$bundle/Docs" -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/SIRK-Agent/* "$bundle/Agent" -Recurse -Force
          Copy-Item artifacts/SIRK-Agent-Client/* "$bundle/Client" -Recurse -Force
          Copy-Item artifacts/SIRK-MeshAdapter/* "$bundle/MeshAdapter" -Recurse -Force
          Copy-Item artifacts/SIRK-WorkspaceHost/* "$bundle/WorkspaceHost" -Recurse -Force
          Copy-Item SIRK-Agent/scripts/Install-SIRKAgent.ps1,SIRK-Agent/scripts/Uninstall-SIRKAgent.ps1,SIRK-Agent/scripts/Test-SIRKAgent.ps1 "$bundle/Scripts" -Force
          Copy-Item SIRK-Agent/README.md "$bundle/Docs/README.md" -Force
          Get-ChildItem $bundle -File -Recurse | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json -Depth 4 | Set-Content "$bundle/SHA256SUMS.json" -Encoding UTF8
          @'
          SIRK-Agent test bundle

          1. Extract the ZIP on a Windows test computer.
          2. Start Windows PowerShell as Administrator.
          3. Run:
             Set-ExecutionPolicy -Scope Process Bypass -Force
             .\Scripts\Test-SIRKAgent.ps1 -BundlePath .
          4. Send the generated JSON report when reporting a problem.
          '@ | Set-Content "$bundle/TESTING.txt" -Encoding UTF8

      - name: Upload component artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-components-win-x64
          path: |
            artifacts/SIRK-Agent
            artifacts/SIRK-Agent-Client
            artifacts/SIRK-MeshAdapter
            artifacts/SIRK-WorkspaceHost
          if-no-files-found: error
          retention-days: 14

      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-TestBundle-win-x64
          path: artifacts/SIRK-Agent-TestBundle
          if-no-files-found: error
          retention-days: 30
