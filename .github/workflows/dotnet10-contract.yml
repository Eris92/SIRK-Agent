name: SIRK Agent .NET 10 Contract

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  dotnet10-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reject legacy compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = Get-ChildItem src,tests,tools -Recurse -File -Filter '*.csproj' -ErrorAction SilentlyContinue
          if (-not $projects) { throw 'No .NET projects found.' }
          foreach ($project in $projects) {
            $text = Get-Content $project.FullName -Raw
            if ($text -notmatch '<TargetFramework>net10\.0(?:-windows(?:10\.0\.17763)?)?</TargetFramework>') {
              throw "Non-.NET 10 project: $($project.FullName)"
            }
            if ($text -match 'net(?:8|9)\.0') { throw "Legacy target in $($project.FullName)" }
          }

          $sourceFiles = Get-ChildItem src,tools -Recurse -File -Include *.ps1,*.csproj,*.props,*.targets -ErrorAction SilentlyContinue
          $legacyPatterns = @(
            'Microsoft\.DotNet\.Runtime\.(?:8|9)(?:\D|$)',
            'Microsoft\.NETCore\.App (?:8|9)\.',
            '-Channel\s+(?:8|9)\.',
            ('AllowSource' + 'Fallback'),
            ('install-release' + '\.ps1')
          )
          $legacy = @()
          foreach ($file in $sourceFiles) {
            $text = Get-Content $file.FullName -Raw
            foreach ($pattern in $legacyPatterns) {
              if ($text -match $pattern) { $legacy += "$($file.FullName) => $pattern" }
            }
          }
          if ($legacy) {
            $legacy | ForEach-Object { Write-Error $_ }
            throw 'Legacy runtime or compatibility reference detected.'
          }

      - name: Restore build and test
        shell: pwsh
        run: |
          $projects = Get-ChildItem src,tools -Recurse -File -Filter '*.csproj'
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $($project.FullName)" }
            dotnet build $project.FullName -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($project.FullName)" }
          }
          $tests = Get-ChildItem tests -Recurse -File -Filter '*.csproj' -ErrorAction SilentlyContinue
          foreach ($test in $tests) {
            dotnet restore $test.FullName
            dotnet test $test.FullName -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($test.FullName)" }
          }
          & pwsh -NoProfile -File tests/shared-updater-installer-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Shared Updater installer contract failed.' }
