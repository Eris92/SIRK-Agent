name: Apply canonical Agent management v1

on:
  push:
    branches:
      - feat/canonical-agent-management-v1

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-agent-management-v1
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply canonical management transport
        shell: pwsh
        run: |
          python .github/scripts/patch_canonical_agent_cli_routes.py
          python .github/scripts/apply_canonical_agent_management_v1.py
      - name: Restore and build Agent products
        shell: pwsh
        run: |
          foreach ($project in @(
            'src/SirkAgent.Service/SirkAgent.Service.csproj',
            'src/SirkAgent.Session/SirkAgent.Session.csproj',
            'src/SirkAgent.Cli/SirkAgent.Cli.csproj',
            'src/SirkAgent.Setup/SirkAgent.Setup.csproj'
          )) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
            dotnet build $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }
      - name: Run canonical management contract
        shell: pwsh
        run: |
          & pwsh -NoProfile -File tests/canonical-agent-management-v1-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Agent management contract failed.' }
      - name: Validate canonical source and core runtime
        shell: pwsh
        run: |
          $legacy = Get-ChildItem src -Recurse -File -Include *.cs |
            Select-String -SimpleMatch '/api/agent/v1/'
          if ($legacy) {
            $legacy | ForEach-Object { Write-Error $_ }
            throw 'Legacy Agent management route remains.'
          }
          $publish = Join-Path $env:RUNNER_TEMP 'canonical-agent-runtime'
          dotnet publish src/SirkAgent.Service/SirkAgent.Service.csproj -c Release -r win-x64 `
            --self-contained false --no-restore -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Agent publish failed.' }
          $runtimeConfig = Get-Content (Join-Path $publish 'SirkAgent.Service.runtimeconfig.json') -Raw
          if ($runtimeConfig -match 'Microsoft.WindowsDesktop.App') {
            throw 'Agent unexpectedly requires Windows Desktop Runtime.'
          }
      - name: Commit product changes
        shell: pwsh
        run: |
          git checkout -- .github/workflows/dotnet10-contract.yml .github/workflows/product-test-readiness.yml
          Remove-Item .github/workflows/apply-canonical-agent-management-v1.yml -Force
          Remove-Item .github/scripts/apply_canonical_agent_management_v1.py -Force
          Remove-Item .github/scripts/patch_canonical_agent_cli_routes.py -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests/canonical-agent-management-v1-contract.ps1 .github/scripts .github/workflows/apply-canonical-agent-management-v1.yml
          git commit -m 'feat: use canonical signed Agent management v1'
          git push origin HEAD:feat/canonical-agent-management-v1
