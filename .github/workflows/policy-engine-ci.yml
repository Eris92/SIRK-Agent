name: SIRK Agent CI

on:
  push:
    branches:
      - main
      - policy-engine-foundation
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/policy-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-test-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows test harness
        run: dotnet publish tools/SirkAgent.Policy.TestHarness/SirkAgent.Policy.TestHarness.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishTrimmed=false --output artifacts/SIRK-Agent-Policy-Test

      - name: Run policy test harness
        shell: pwsh
        run: ./artifacts/SIRK-Agent-Policy-Test/SirkAgent.Policy.TestHarness.exe

      - name: Publish agent runtime
        run: dotnet publish src/SirkAgent.Service/SirkAgent.Service.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishTrimmed=false -p:InformationalVersion=1.0.0+${{ github.sha }} --output artifacts/SIRK-Agent-Runtime

      - name: Publish diagnostics reporter
        run: dotnet publish src/SirkAgent.Report/SirkAgent.Report.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishTrimmed=false --output artifacts/SIRK-Agent-Runtime

      - name: Publish CLI and interactive session broker
        shell: pwsh
        run: |
          dotnet publish src/SirkAgent.Cli/SirkAgent.Cli.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.Session/SirkAgent.Session.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/SIRK-Agent-Runtime
          dotnet publish src/SirkAgent.BrowserHost/SirkAgent.BrowserHost.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/SIRK-Agent-Runtime

      - name: Add package tools and manifest
        shell: pwsh
        run: |
          Copy-Item tools/package/*.ps1 artifacts/SIRK-Agent-Runtime/ -Force
          Copy-Item browser-extension artifacts/SIRK-Agent-Runtime/BrowserExtension -Recurse -Force
          $protected = @('SirkAgent.Service.exe','SirkAgent.Service.dll','SirkAgent.Policy.dll','SirkAgent.Report.exe','sirkctl.exe','SirkAgent.Session.exe','SirkAgent.Session.dll','SirkAgent.BrowserHost.exe','SirkAgent.BrowserHost.dll')
          $files = foreach ($name in $protected) {
            @{ path = $name; sha256 = (Get-FileHash (Join-Path artifacts/SIRK-Agent-Runtime $name) -Algorithm SHA256).Hash }
          }
          @{ files = $files } | ConvertTo-Json -Depth 5 | Set-Content artifacts/SIRK-Agent-Runtime/integrity-manifest.json -Encoding UTF8
          @{
            product = 'SIRK Agent'
            version = '1.0.0'
            commit = '${{ github.sha }}'
            buildUtc = (Get-Date).ToUniversalTime().ToString('o')
            runtime = 'win-x64'
            deployment = 'framework-dependent'
            requiredRuntime = '.NET 8 x64'
          } | ConvertTo-Json | Set-Content artifacts/SIRK-Agent-Runtime/build-manifest.json -Encoding UTF8

      - name: Validate clean first startup
        shell: pwsh
        run: |
          $agentRoot = Join-Path $env:ProgramData 'SIRK\Agent'
          Remove-Item $agentRoot -Recurse -Force -ErrorAction SilentlyContinue
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Service.exe --once
          $heartbeat = Get-Content (Join-Path $agentRoot 'heartbeat-latest.json') -Raw | ConvertFrom-Json
          if ($heartbeat.tamperDetected) { throw "Clean startup reported tamper: $($heartbeat.tamperReason)" }
          if ($heartbeat.quarantineActive) { throw "Clean startup entered quarantine: $($heartbeat.quarantineReason)" }
          if ($heartbeat.stateStatus -notin @('STATE_INITIALIZED','OK')) { throw "Unexpected clean state: $($heartbeat.stateStatus)" }
          if (-not (Test-Path (Join-Path $agentRoot 'policy-state.bin'))) { throw 'Protected policy state was not initialized.' }

      - name: Validate clean report module classification
        shell: pwsh
        run: |
          $agentRoot = Join-Path $env:ProgramData 'SIRK\Agent'
          $reportPath = Join-Path $agentRoot 'Reports\clean-once-state.json'
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Report.exe --json-only $reportPath
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $heartbeatModule = $report.modules | Where-Object name -eq 'Policy / Heartbeat'
          if ($heartbeatModule.status -ne 'Healthy') { throw "Heartbeat report status is $($heartbeatModule.status)." }
          $tamperModule = $report.modules | Where-Object name -eq 'Latest tamper event'
          if ($tamperModule.status -ne 'Healthy') { throw "Missing tamper-event report status is $($tamperModule.status)." }
          $quarantineModule = $report.modules | Where-Object name -eq 'Protected quarantine state'
          if ($quarantineModule.status -ne 'Healthy') { throw "Missing quarantine-state report status is $($quarantineModule.status)." }

      - name: Validate corrupt-state detection and test recovery
        shell: pwsh
        run: |
          function Assert-Ci([bool]$Condition, [string]$Message) {
            if (-not $Condition) {
              Write-Output "::error title=Corrupt-state recovery failed::$Message"
              throw $Message
            }
          }

          $agentRoot = Join-Path $env:ProgramData 'SIRK\Agent'
          $identityPath = Join-Path $agentRoot 'device-identity.bin'
          $identityHashBefore = (Get-FileHash $identityPath -Algorithm SHA256).Hash
          [IO.File]::WriteAllBytes((Join-Path $agentRoot 'policy-state.bin'), [byte[]](1,2,3,4))
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Service.exe --once
          $broken = Get-Content (Join-Path $agentRoot 'heartbeat-latest.json') -Raw | ConvertFrom-Json
          Assert-Ci $broken.tamperDetected "Corrupt state was not detected: stateStatus=$($broken.stateStatus), tamperReason=$($broken.tamperReason)."
          Assert-Ci $broken.quarantineActive "Corrupt state did not activate quarantine: stateStatus=$($broken.stateStatus), tamperReason=$($broken.tamperReason)."
          ./artifacts/SIRK-Agent-Runtime/Reset-SirkAgentTestState.ps1
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Service.exe --once
          $recovered = Get-Content (Join-Path $agentRoot 'heartbeat-latest.json') -Raw | ConvertFrom-Json
          Assert-Ci (-not $recovered.tamperDetected) "Recovered state still reports tamper: $($recovered.tamperReason)"
          Assert-Ci (-not $recovered.quarantineActive) "Recovered state remains quarantined: $($recovered.quarantineReason)"
          $identityHashAfter = (Get-FileHash $identityPath -Algorithm SHA256).Hash
          Assert-Ci ($identityHashBefore -eq $identityHashAfter) 'Device identity changed during test-state recovery.'
          Assert-Ci ([bool](Get-ChildItem (Join-Path $agentRoot 'ResetArchive') -Filter reset-manifest.json -Recurse -ErrorAction SilentlyContinue)) 'Reset archive manifest was not generated.'

      - name: Generate and validate HTML and JSON reports
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Report.exe --no-open
          $reports = Join-Path $env:ProgramData 'SIRK\Agent\Reports'
          if (-not (Get-ChildItem $reports -Filter '*.json' -ErrorAction SilentlyContinue)) { throw 'JSON report was not generated.' }
          if (-not (Get-ChildItem $reports -Filter '*.html' -ErrorAction SilentlyContinue)) { throw 'HTML report was not generated.' }
          if (-not (Test-Path (Join-Path $env:ProgramData 'SIRK\Agent\security-state.json'))) { throw 'Security state was not generated.' }
          if (-not (Test-Path (Join-Path $env:ProgramData 'SIRK\Agent\device-identity.bin'))) { throw 'Device identity was not generated.' }

      - name: Smoke test Windows service and all-green report
        shell: pwsh
        run: |
          ./artifacts/SIRK-Agent-Runtime/Install-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent CI"
          $service = Get-Service SirkAgent
          if ($service.Status -ne 'Running') { throw "Service status is $($service.Status)" }
          Start-Sleep -Seconds 5
          $agentRoot = Join-Path $env:ProgramData 'SIRK\Agent'
          $reportPath = Join-Path $agentRoot 'Reports\running-service-state.json'
          ./artifacts/SIRK-Agent-Runtime/SirkAgent.Report.exe --json-only $reportPath
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if ($report.overallStatus -ne 'Healthy') { throw "Running service report status is $($report.overallStatus)." }
          if ($report.summary.warning -ne 0) { throw "Running service report contains $($report.summary.warning) warnings." }
          if ($report.summary.critical -ne 0) { throw "Running service report contains $($report.summary.critical) critical modules." }
          ./artifacts/SIRK-Agent-Runtime/Uninstall-SirkAgent.ps1 -InstallPath "$env:ProgramFiles\SIRK Agent CI" -Confirm:$false

      - name: Validate TestBundle collection
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts/TestBundles'
          ./artifacts/SIRK-Agent-Runtime/Collect-SirkAgent-TestBundle.ps1 -OutputDirectory $out
          if (-not (Get-ChildItem $out -Filter '*.zip' -ErrorAction SilentlyContinue)) { throw 'TestBundle ZIP was not generated.' }

      - name: Add launchers and README
        shell: pwsh
        run: |
          '@echo off
          cd /d "%~dp0"
          SirkAgent.Service.exe --once
          pause' | Set-Content artifacts/SIRK-Agent-Runtime/TEST-AGENT-ONCE.cmd -Encoding ascii

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install-SirkAgent.ps1"
          pause' | Set-Content artifacts/SIRK-Agent-Runtime/INSTALL-SERVICE-AS-ADMIN.cmd -Encoding ascii

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Uninstall-SirkAgent.ps1"
          pause' | Set-Content artifacts/SIRK-Agent-Runtime/UNINSTALL-SERVICE-AS-ADMIN.cmd -Encoding ascii

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Reset-SirkAgentTestState.ps1"
          pause' | Set-Content artifacts/SIRK-Agent-Runtime/RESET-TEST-STATE-AS-ADMIN.cmd -Encoding ascii

          '@echo off
          cd /d "%~dp0"
          SirkAgent.Report.exe
          pause' | Set-Content artifacts/SIRK-Agent-Runtime/GENERATE-HTML-AND-JSON-REPORT.cmd -Encoding ascii

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Collect-SirkAgent-TestBundle.ps1"
          pause' | Set-Content artifacts/SIRK-Agent-Runtime/COLLECT-TEST-BUNDLE.cmd -Encoding ascii

          @'
          SIRK AGENT 0.2.3 TEST

          Wymagania: Windows x64 oraz Microsoft .NET 8 Runtime x64.

          1. Czysty pierwszy start automatycznie tworzy chroniony policy-state.bin.
          2. Uruchom TEST-AGENT-ONCE.cmd i wygeneruj raport.
          3. Do testu stalego uruchom jako administrator INSTALL-SERVICE-AS-ADMIN.cmd.
          4. Dane agenta: C:\ProgramData\SIRK\Agent
          5. Paczka do przeslania: COLLECT-TEST-BUNDLE.cmd
          6. Usuniecie: UNINSTALL-SERVICE-AS-ADMIN.cmd

          Gdy poprzednia wersja pozostawila STATE_UNPROTECT_FAILED, uruchom jako administrator:
          RESET-TEST-STATE-AS-ADMIN.cmd

          Reset archiwizuje stan polityki i kwarantanny, ale zachowuje Device ID, Evidence Chain, Telemetry Queue i log zdarzen.
          Funkcja resetu jest tylko dla wersji testowej. Produkcyjny recovery bedzie wymagal podpisanej Recovery Policy.
          '@ | Set-Content artifacts/SIRK-Agent-Runtime/TEST-INSTRUCTIONS.txt -Encoding UTF8

      - name: Create distributable ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/SIRK-Agent-Runtime/* -DestinationPath artifacts/SIRK-Agent-1.0.0-win-x64.zip -CompressionLevel Optimal -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-1.0.0-win-x64
          path: |
            artifacts/SIRK-Agent-1.0.0-win-x64.zip
            artifacts/SIRK-Agent-Runtime/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SIRK-Agent-TestBundles-CI
          path: artifacts/TestBundles/*.zip
          if-no-files-found: error

  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore tests
        run: dotnet restore tests/SirkAgent.Policy.Tests/SirkAgent.Policy.Tests.csproj
      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/SirkAgent.Policy.Tests/SirkAgent.Policy.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=detailed" 2>&1 | Tee-Object -FilePath unit-test.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SIRK-Agent-Policy-Unit-Test-Log
          path: unit-test.log
          if-no-files-found: warn
