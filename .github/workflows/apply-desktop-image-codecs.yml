name: Apply desktop image codecs

on:
  push:
    branches:
      - feat/desktop-image-codecs

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-image-codecs
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply image codec support
        shell: pwsh
        run: python .github/scripts/apply_desktop_image_codecs.py
      - name: Validate source contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/desktop-image-codec-contract.ps1
      - name: Restore and build Agent components
        shell: pwsh
        run: |
          dotnet restore src/SirkAgent.Session/SirkAgent.Session.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Session restore failed.' }
          dotnet build src/SirkAgent.Session/SirkAgent.Session.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Session build failed.' }
          dotnet restore src/SirkAgent.Service/SirkAgent.Service.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Service restore failed.' }
          dotnet build src/SirkAgent.Service/SirkAgent.Service.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed.' }
      - name: Publish and execute codec self-test
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'sirk-session-codecs'
          dotnet publish src/SirkAgent.Session/SirkAgent.Session.csproj -c Release -r win-x64 `
            --self-contained false --no-restore -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Session publish failed.' }
          $codecTest = Start-Process -FilePath (Join-Path $publish 'SirkAgent.Session.exe') `
            -ArgumentList '--codec-self-test' -PassThru -Wait -WindowStyle Hidden
          if ($codecTest.ExitCode -ne 0) {
            throw "Codec self-test failed. ExitCode=$($codecTest.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $publish 'libSkiaSharp.dll'))) {
            throw 'Published Windows runtime does not contain libSkiaSharp.dll.'
          }
          $runtimeConfig = Get-Content (Join-Path $publish 'SirkAgent.Session.runtimeconfig.json') -Raw
          if ($runtimeConfig -match 'Microsoft.WindowsDesktop.App') {
            throw 'Session unexpectedly requires Windows Desktop Runtime.'
          }
      - name: Commit product changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SirkAgent.Session/Program.cs `
                  src/SirkAgent.Session/SirkAgent.Session.csproj `
                  src/SirkAgent.Service/DesktopStreamWorker.cs `
                  tests/desktop-image-codec-contract.ps1 `
                  .github/workflows/dotnet10-contract.yml
          git commit -m 'feat: add WebP PNG and JPEG desktop image codecs'
          git push origin HEAD:feat/desktop-image-codecs
